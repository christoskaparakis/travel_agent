[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-assistant-agent"
version = "0.1.0"
description = "An LLM-powered assistant for travel planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"google-adk>=2.4.0,<2.5.0",
	"litellm>=1.84.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]